name: Release plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release tag matches the manifest
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./manifest.json').version) throw new Error('Tag and manifest versions differ')"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/plugin.zip dist/plugin.zip.sha256
          --verify-tag --title "Feishu $GITHUB_REF_NAME"
          --generate-notes
